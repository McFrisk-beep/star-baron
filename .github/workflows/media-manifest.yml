# Drop a file in assets/broadcast/ or assets/bgm/ and this regenerates
# js/media-manifest.js for you, so nobody has to run the generator by hand.
# (A static site can't list a directory, so the file names have to be baked in.)
name: media manifest

on:
  push:
    branches: ["**"]        # branches only — a tag push has nowhere to commit back to
    paths:
      - "assets/broadcast/**"
      - "assets/bgm/**"
      - "tools/gen_media_manifest.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the manifest from the file names
        run: python3 tools/gen_media_manifest.py

      # No change → no commit → no re-trigger, so this can't loop.
      - name: Commit it if it changed
        run: |
          if git diff --quiet js/media-manifest.js; then
            echo "manifest already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/media-manifest.js
          git commit -m "Regenerate media manifest from assets/"
          git push origin HEAD:"${GITHUB_REF_NAME}"
