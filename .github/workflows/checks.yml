# Runs the repo's no-framework checks (tools/check_*.js) on every push and PR.
# They were already here and already green — nothing was running them, so the
# save-migration bug in PR #83 shipped past a suite that would have caught it.
name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Phase 1 is a static site with no build step or package manager, so this
      # is plain `node file.js` — no install, nothing to cache.
      - name: Syntax-check every script
        run: for f in js/*.js tools/*.js; do node --check "$f" || exit 1; done

      # No "is js/media-manifest.js stale?" gate here on purpose. The
      # media-manifest workflow regenerates it on every push, and GitHub does
      # not re-run workflows for pushes made with the default GITHUB_TOKEN — so
      # a failure here could never be cleared by the bot's own fix-up commit and
      # would just sit red forever. The bot is the guarantee; verified by
      # pushing a new frame with a deliberately stale manifest and watching it
      # commit the correction 17s later.

      - name: Run checks
        run: |
          # Quarantined: failing on main before this workflow existed. Each needs a
          # domain call (is the JS or the SQL right?), not a CI change. Delete the
          # line as each is fixed — the list should only ever get shorter.
          # (check_market_depth un-quarantined: rewrote for finite sector stock.)
          # (check_market_parity + check_bazaar_parity fixed: commodity/event pools
          #  and app.gen_extractor now track the full tradeable COMMODITIES list.)
          SKIP=""
          fail=0
          for f in tools/check_*.js; do
            name=$(basename "$f" .js)
            case " $SKIP " in *" $name "*) echo ":: skip $name (quarantined)"; continue;; esac
            echo ":: $name"
            node "$f" > /tmp/out.log 2>&1 || { fail=1; echo "FAILED $name"; tail -30 /tmp/out.log; }
          done
          exit $fail
